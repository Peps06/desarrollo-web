<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Bitácora de Viajes'">Bitácora de Viajes</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <link rel="stylesheet" th:href="@{/css/presupuesto.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <header th:fragment="navbar" class="barra-nav">
        <div class="contenedor barra-nav__contenido">
            <a th:href="@{/viajes}" class="barra-nav__marca">Bitácora de viajes</a>
            <ul class="barra-nav__enlaces">
                <li><a th:href="@{/viajes}">Mis viajes</a></li>
                <li><a th:href="@{/viajes/nuevo}">Nuevo viaje</a></li>
                <li><button type="button" class="btn-texto" onclick="cerrarSesion()">Cerrar sesión</button></li>
            </ul>
        </div>
        <div id="contenedorMensajes" class="contenedor-mensajes" aria-live="polite"></div>
        <script th:src="@{/js/mensajes.js}"></script>
        <script th:src="@{/js/auth.js}"></script>
    </header>
</body>
</html>
