<!-- PRUEBAS -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Iniciar sesión')}"></head>
<body>
    <main class="contenedor-principal">
        <section class="tarjeta-formulario">
            <div class="encabezado-seccion">
                <h1>Iniciar sesión</h1>
                <p>Acceso de prueba para sesión en navegador.</p>
            </div>
            <div id="errorLogin" class="alerta alerta-error oculto"></div>
            <form id="formLogin">
                <div class="campo-grupo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" value="ana@example.com" required>
                </div>
                <div class="campo-grupo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" value="Password123" required>
                </div>
                <button type="submit" class="btn btn-primario">Entrar</button>
            </form>
        </section>
    </main>
    <script>
        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    correo: document.getElementById("correo").value,
                    contrasena: document.getElementById("contrasena").value
                })
            });
            if (res.ok) {
                window.location.href = "/viajes/nuevo";
            } else {
                const err = document.getElementById("errorLogin");
                err.textContent = "Credenciales incorrectas";
                err.classList.remove("oculto");
            }
        });
    </script>
</body>
</html>
