<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Iniciar sesión')}"></head>
<body>
    <div id="contenedorMensajes" class="contenedor-mensajes" aria-live="polite"></div>

    <main class="acceso">
        <section class="tarjeta">
            <h1>Iniciar sesión</h1>

            <form id="formLogin" class="formulario" novalidate>
                <div class="campo" id="grupo-correo">
                    <label for="correo" class="campo__etiqueta">Correo</label>
                    <input type="email" id="correo" autocomplete="email">
                    <span class="campo__error" id="error-correo"></span>
                </div>

                <div class="campo" id="grupo-contrasena">
                    <label for="contrasena" class="campo__etiqueta">Contraseña</label>
                    <input type="password" id="contrasena" autocomplete="current-password">
                    <span class="campo__error" id="error-contrasena"></span>
                </div>

                <button type="submit" class="btn btn-primario">Entrar</button>
            </form>

            <p class="texto-suave">¿No tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a></p>
        </section>
    </main>

    <script th:src="@{/js/validacion.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
