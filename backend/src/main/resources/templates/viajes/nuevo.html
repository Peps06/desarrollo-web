<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Crear nuevo viaje')}"></head>
<body>
    <header th:replace="~{fragments/base :: navbar}"></header>

    <div id="contenedorMensajes" class="contenedor-mensajes" aria-live="polite"></div>

    <main class="contenedor">
        <section class="tarjeta">
            <h1 class="tarjeta__titulo">Planear un nuevo viaje</h1>
            <p class="tarjeta__meta">Completa los datos básicos para comenzar a organizar tu itinerario en grupo.</p>

            <form id="formNuevoViaje" class="formulario formulario--ancho" novalidate>
                <div class="campo" id="grupo-destino">
                    <label for="destino" class="campo__etiqueta">Destino *</label>
                    <input
                        type="text"
                        id="destino"
                        name="destino"
                        maxlength="150"
                        placeholder="Ej. Oaxaca, Oaxaca"
                        required
                    >
                    <span class="campo__error" id="error-destino"></span>
                </div>

                <div class="formulario__fila">
                    <div class="campo" id="grupo-fechaInicio">
                        <label for="fechaInicio" class="campo__etiqueta">Fecha de inicio *</label>
                        <input
                            type="date"
                            id="fechaInicio"
                            name="fechaInicio"
                            required
                        >
                        <span class="campo__error" id="error-fechaInicio"></span>
                    </div>

                    <div class="campo" id="grupo-fechaFin">
                        <label for="fechaFin" class="campo__etiqueta">Fecha de fin *</label>
                        <input
                            type="date"
                            id="fechaFin"
                            name="fechaFin"
                            required
                        >
                        <span class="campo__error" id="error-fechaFin"></span>
                    </div>
                </div>

                <div class="formulario__fila">
                    <div class="campo" id="grupo-presupuestoTotal">
                        <label for="presupuestoTotal" class="campo__etiqueta">Presupuesto total *</label>
                        <input
                            type="number"
                            id="presupuestoTotal"
                            name="presupuestoTotal"
                            step="0.01"
                            min="0.01"
                            placeholder="Ej. 15000.00"
                            required
                        >
                        <span class="campo__error" id="error-presupuestoTotal"></span>
                    </div>

                    <div class="campo" id="grupo-monedaBase">
                        <label for="monedaBase" class="campo__etiqueta">Moneda base *</label>
                        <select id="monedaBase" name="monedaBase" required>
                            <option value="MXN" selected>MXN - Peso mexicano</option>
                            <option value="USD">USD - Dólar estadounidense</option>
                            <option value="EUR">EUR - Euro</option>
                        </select>
                        <span class="campo__error" id="error-monedaBase"></span>
                    </div>
                </div>

                <div class="formulario__fila">
                    <a th:href="@{/viajes}" class="btn btn-secundario">Cancelar</a>
                    <button type="submit" id="btnGuardarViaje" class="btn btn-primario">
                        Crear viaje
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script th:src="@{/js/viaje-nuevo.js}"></script>
</body>
</html>
